plugins { id 'com.android.application' }
// Whole package: the app's web files (apps/studio/) are copied into the APK, and its version is the one in studio.js.
// To release a new version: change VERSION in apps/studio/studio.js (and catalog.json "version"); the APK builds itself.
def webVersionFile = '../../../apps/studio/studio.js'
def webVer = (file(webVersionFile).text =~ /const VERSION = '([^']+)'/)[0][1]
def webCode = webVer.tokenize('.').collect { it as int }.with { it[0] * 1000000 + it[1] * 1000 + it[2] } + 100
def webDir = layout.buildDirectory.dir('webassets')
tasks.register('copyWeb', Sync) {
    from('../../../apps/studio') { into 'web' }
    into webDir
}
preBuild.dependsOn 'copyWeb'
android {
    namespace 'com.glickshulem.studio'
    compileSdk 34
    defaultConfig {
        applicationId 'com.glickshulem.studio'
        minSdk 24
        targetSdk 34
        versionCode webCode
        versionName webVer
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'none')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    sourceSets { main { assets.srcDirs += webDir.get().asFile } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // jump3r has one helper class that needs javax.sound (not on Android); we never use it.
    lint { checkReleaseBuilds false; abortOnError false }
}
dependencies {
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'de.sciss:jump3r:1.0.5'
}
