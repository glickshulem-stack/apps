plugins { id 'com.android.application' }
android {
    namespace 'com.glickshulem.apphub'
    compileSdk 34
    defaultConfig {
        applicationId 'com.glickshulem.apphub'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '0.11.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'none')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
