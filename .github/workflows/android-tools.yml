name: Android build tools
# Packs the Android SDK build tools (aapt2, d8, zipalign, apksigner) and android.jar from the
# GitHub runner into a short-lived artifact, so apps built outside this repo (like Quillsong)
# can be compiled and signed elsewhere. No source code or keys are involved.
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-szp6cs']
    paths: ['.github/workflows/android-tools.yml']
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Pack tools
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ls $SDK/build-tools $SDK/platforms
          test -d $SDK/build-tools/35.0.0 || yes | $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"
          test -d $SDK/platforms/android-35 || yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"
          mkdir -p out/build-tools out/platforms/android-35
          cp -a $SDK/build-tools/35.0.0 out/build-tools/
          cp $SDK/platforms/android-35/android.jar out/platforms/android-35/
          tar czf android-tools.tgz -C out .
          ls -la android-tools.tgz
      - name: Hand over on a temporary branch (removed again after 15 minutes)
        run: |
          mkdir hand && cd hand && git init -q && git checkout -q -b tmp/android-tools
          mv ../android-tools.tgz . && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm tools
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp/android-tools
          sleep 900
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" --delete tmp/android-tools
