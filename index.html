<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Su's Apps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#111827; --card:#1f2937; --text:#f9fafb; --muted:#9ca3af; --accent:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { padding:24px 16px 8px; text-align:center; }
  h1 { margin:0; font-size:1.8rem; }
  .ver { color:var(--muted); font-size:.85rem; margin-top:4px; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; padding:16px; max-width:900px; margin:0 auto; }
  a.app { display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px 12px; background:var(--card); border-radius:18px; text-decoration:none; color:var(--text); transition:transform .1s; }
  a.app:active { transform:scale(.96); }
  .app .icon { font-size:3.5rem; line-height:1; }
  .app .name { font-weight:600; font-size:1.1rem; }
  .app .appver { color:var(--muted); font-size:.8rem; }
  #update { display:none; position:fixed; bottom:16px; left:16px; right:16px; background:var(--accent); color:#111; padding:12px; border-radius:12px; text-align:center; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Su's Apps</h1>
  <div class="ver">App Hub v<span id="hubver"></span></div>
</header>
<main id="apps"></main>
<div id="update">Updated to the newest version</div>
<script src="apps.js"></script>
<script>
  document.getElementById('hubver').textContent = HUB_VERSION;
  const el = document.getElementById('apps');
  for (const a of APPS) {
    const link = document.createElement('a');
    link.className = 'app'; link.href = a.path;
    link.innerHTML = `<div class="icon">${a.icon}</div><div class="name">${a.name}</div><div class="appver">v${a.version}</div>`;
    el.appendChild(link);
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
    });
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return; reloaded = true;
      sessionStorage.setItem('justUpdated', '1');
      location.reload();
    });
    if (sessionStorage.getItem('justUpdated')) {
      sessionStorage.removeItem('justUpdated');
      const u = document.getElementById('update'); u.style.display = 'block';
      setTimeout(() => u.style.display = 'none', 3000);
    }
  }
</script>
</body>
</html>
