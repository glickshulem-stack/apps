<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* One look (Su, page 0.32.0): Navy & Gold, flat and calm, no gradients. Same colors as App Vault Studio. Never green. */
  :root { --bg:#0f1626; --bg2:#0f1626; --surface:#172136; --surface2:#1f2b43; --text:#f1f3f8; --muted:#a8b2c7; --line:#2a3753;
    --gold:#d4a64a; --gold2:#e2bc6a; --goldhi:#f3d58f; --glow:transparent; --cover:#1b2740; --shadow:0 4px 14px rgba(0,0,0,.3); --bar:#0f1626; color-scheme:dark; }
  .cover, .d-icon { background:var(--cover) !important; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:Inter,system-ui,Roboto,sans-serif; color:var(--text); user-select:none; min-height:100vh;
    background:radial-gradient(1200px 500px at 85% -10%, var(--glow), transparent 60%), radial-gradient(900px 500px at -10% 110%, var(--glow), transparent 60%), linear-gradient(180deg,var(--bg),var(--bg2)); background-attachment:fixed; }
  .serif { font-family:Cinzel,Georgia,serif; }
  .goldtext { background:linear-gradient(100deg,#9a6a22 0%,#e8c272 35%,#b8862f 55%,#f3d58f 75%,#9a6a22 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .appbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:12px 24px; background:var(--bar); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .appbar::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.7; }
  .appbar img { width:38px; height:38px; border-radius:10px; box-shadow:0 0 0 1px var(--gold), 0 4px 12px var(--glow); }
  .appbar h1 { margin:0; font:700 1.45rem/1 Cinzel,Georgia,serif; letter-spacing:.06em; flex:1; }
  .iconbtn { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--gold2); box-shadow:var(--shadow); }
  .iconbtn:active { transform:scale(.94); }
  .iconbtn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  main { max-width:1180px; margin:0 auto; padding:22px 24px 40px; }
  /* greeting */
  .welcome { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:4px 4px 18px; }
  .welcome .d { color:var(--muted); font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  .welcome h2 { margin:4px 0 0; font:700 2rem/1.15 Cinzel,Georgia,serif; }
  /* section titles with a gold rule */
  h3 { display:flex; align-items:center; gap:14px; margin:30px 4px 14px; font:700 1.15rem Cinzel,Georgia,serif; letter-spacing:.05em; }
  h3::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--gold),transparent); opacity:.6; }
  /* app tiles */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
  .gone { display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--gold); border-radius:20px; padding:16px 20px; margin:18px 0 0; box-shadow:var(--shadow); }
  .gone img { width:52px; height:52px; border-radius:14px; filter:grayscale(.6); opacity:.8; flex:none; }
  .gone .t { flex:1; min-width:0; } .gone b { font:700 1.05rem Cinzel,Georgia,serif; display:block; } .gone span { color:var(--muted); font-size:.9rem; }
  .gone .acts { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .gone button { border-radius:12px; padding:10px 16px; font-weight:700; cursor:pointer; }
  .gone .un { border:0; color:#1a1208; background:linear-gradient(180deg,var(--goldhi),var(--gold)); }
  .gone .keep { border:1px solid var(--line); background:var(--surface2); color:var(--gold2); }
  .card { position:relative; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:var(--shadow); transition:transform .2s; }
  .card:active { transform:scale(.99); }
  .cover { position:relative; height:118px; display:flex; align-items:center; justify-content:center; background:linear-gradient(120deg,#2b1d12 0%,#4a3422 55%,#6b4a2c 100%); }
  .cover::after { content:''; position:absolute; inset:auto 0 0 0; height:2px; background:linear-gradient(90deg,transparent,#e6c79a,transparent); }
  .cover .cat { position:absolute; top:12px; left:14px; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:#e6c79a; }
  .cover img { width:84px; height:84px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
  .info { padding:16px 18px 18px; display:flex; flex-direction:column; flex:1; }
  .name { font:700 1.2rem Cinzel,Georgia,serif; letter-spacing:.02em; }
  .sub { color:var(--muted); font-size:.9rem; margin-top:4px; line-height:1.4; }
  .foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:14px; }
  .meta { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:.78rem; font-weight:600; padding:5px 10px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); }
  .meta.up { color:var(--gold2); border-color:var(--gold); }
  .status { color:var(--gold2); font-size:.82rem; margin-top:8px; font-weight:600; }
  .btn { border:0; border-radius:999px; padding:10px 24px; font:700 .95rem Inter,sans-serif; cursor:pointer; color:#2a1d10; background:linear-gradient(135deg,#f6dc9c,#c9993f); box-shadow:0 4px 12px var(--glow); }
  .btn.open { background:transparent; color:var(--gold2); box-shadow:inset 0 0 0 1.5px var(--gold); }
  .btn.update { animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px var(--glow); } }
  .btn:active { transform:scale(.96); }
  .status.done { color:var(--gold2); }
  .status.warn { color:#b45309; }
  .bar { height:8px; border-radius:4px; background:var(--surface2); overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; width:0; border-radius:4px; background:linear-gradient(90deg,var(--gold),var(--goldhi)); transition:width .4s; }
  .bar.wait i { width:35%; animation:slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(300%); } }
  /* what's new list */
  .news { background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:6px 22px; }
  .ni { display:flex; gap:16px; align-items:center; padding:14px 0; border-top:1px solid var(--line); }
  .ni:first-child { border-top:0; }
  .ni img { width:42px; height:42px; flex:none; }
  .ni .t { flex:1; min-width:0; } .ni .t b { font-weight:700; } .ni .t span { display:block; color:var(--muted); font-size:.88rem; margin-top:2px; }
  .ni .v { font-size:.78rem; font-weight:700; color:var(--gold2); white-space:nowrap; text-align:right; } .ni .v small { display:block; color:var(--muted); font-weight:500; margin-top:2px; }
  .msg { text-align:center; color:var(--muted); padding:40px; }
  /* Settings: a panel that slides in from the right; swipe it right (or tap outside, or ✕) to close */
  .sheet-bg { position:fixed; inset:0; z-index:15; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .3s; }
  .sheet-bg.show { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; top:0; right:0; bottom:0; width:min(460px,92vw); overflow-y:auto; overscroll-behavior:contain; background:var(--bg); border-left:1px solid var(--gold);
    box-shadow:-20px 0 50px rgba(0,0,0,.35); padding:0 22px 30px; transform:translateX(105%); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .sheet-bg.show .sheet { transform:none; }
  .sheet.drag { transition:none; }
  .sheet-head { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:12px; margin:0 -22px 6px; padding:16px 22px; background:var(--bar); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .sheet-head h4 { flex:1; margin:0; font:700 1.45rem Cinzel,Georgia,serif; letter-spacing:.04em; }
  .sheet h5 { margin:22px 4px 10px; font:700 .78rem Inter,sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--gold2); }
  .box { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:4px 16px; box-shadow:var(--shadow); }
  .box .row:first-child { border-top:0; }
  .row small { display:block; color:var(--muted); font-size:.8rem; margin-top:3px; font-weight:400; }
  .row .vv { font-weight:700; color:var(--gold2) !important; font-size:1.05rem; }
  .bigbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:15px; border:0; border-radius:16px; cursor:pointer;
    font:700 1.05rem Inter,sans-serif; color:#2a1d10; background:linear-gradient(135deg,#f6dc9c,#c9993f); box-shadow:0 6px 18px var(--glow); }
  .bigbtn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .bigbtn:active { transform:scale(.98); }
  .last { text-align:center; color:var(--muted); font-size:.82rem; margin-top:8px; }
  .seg { display:flex; gap:10px; }
  .seg button { flex:1; padding:12px; border-radius:14px; cursor:pointer; font:700 .95rem Inter,sans-serif; color:var(--text); background:var(--surface); border:1px solid var(--line); }
  .seg button.on { border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold), 0 4px 12px var(--glow); color:var(--gold2); }
  .seg button i { display:block; height:34px; border-radius:8px; margin-bottom:8px; border:1px solid var(--line); }
  /* What's new opens as its own page inside Settings */
  .sheet.sub { transform:translateX(105%); z-index:2; }
  .sheet-bg.show .sheet.sub { transform:translateX(105%); }
  .backbtn { display:flex; align-items:center; gap:4px; border:0; background:none; cursor:pointer; color:var(--gold2); font:700 1rem Inter,sans-serif; padding:8px 4px; }
  .backbtn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .rl { display:flex; align-items:center; gap:14px; } .rl > span, .row.go .rl > span:last-child { color:var(--text); font-weight:600; font-size:1rem; line-height:1.3; }
  .ri { width:22px; height:22px; flex:none; fill:none; stroke:var(--gold2); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; color:var(--gold2); }
  .row.go span:last-child { color:var(--gold2); font-size:1.4rem; line-height:1; }
  .row.go > .rl { flex:1; min-width:0; } .row.go > span:last-child { flex:none; display:flex; align-items:center; gap:4px; white-space:nowrap; margin-left:10px; }
  .sheet #s-upd-x { padding:0 0 10px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-top:1px solid var(--line); }
  .row span:last-child { color:var(--muted); }
  .iconbtn.dot { position:relative; } .iconbtn.dot::after { content:''; position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold); }
  @media (max-width:640px) { .welcome h2 { font-size:1.5rem; } main { padding:16px; } }
  /* refresh: the arrow spins while checking, then a toast says what happened */
  #refresh.spin { opacity:.85; }
  #refresh.spin svg { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* pull to refresh: drag down at the top of the page, a gold circle follows, let go to check for updates */
  html, body { overscroll-behavior-y:contain; }
  .ptr { position:fixed; left:50%; top:0; z-index:4; width:46px; height:46px; margin-left:-23px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--gold); box-shadow:0 8px 22px rgba(0,0,0,.35); color:var(--gold2); transform:translateY(-60px); opacity:0; pointer-events:none; }
  .ptr svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .ptr.ready { background:linear-gradient(135deg,#f6dc9c,#c9993f); color:#2a1d10; }
  .ptr.back { transition:transform .3s, opacity .3s; }
  .ptr.spin svg { animation:spin .8s linear infinite; }
  .toast { position:fixed; left:50%; bottom:28px; z-index:20; display:flex; align-items:center; gap:12px; max-width:calc(100% - 32px);
    padding:14px 22px 14px 16px; border-radius:16px; background:#1f2b43; color:#f1f3f8; border:1px solid #d4a64a;
    box-shadow:0 14px 34px rgba(0,0,0,.4); font-weight:600; transform:translate(-50%,140%); opacity:0; transition:transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s; }
  .toast.show { transform:translate(-50%,0); opacity:1; }
  .toast { touch-action:pan-y; cursor:grab; }
  .toast.drag { transition:none; }
  .toast .ti { width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#f3d58f,#b8862f); color:#2a1d10; font-weight:800; }
  .toast small { display:block; font-weight:500; color:#e6c79a; margin-top:2px; }
  .row.click { cursor:pointer; } .row.click span:first-child { color:var(--gold2); font-weight:600; }
  .card { cursor:pointer; }
  /* App page: opens over the list when you tap an app, like a store page. Back (‹ or Android back) closes it. */
  .detail { position:fixed; inset:0; z-index:10; overflow-y:auto; overscroll-behavior:contain; background:linear-gradient(180deg,var(--bg),var(--bg2));
    transform:translateX(100%); visibility:hidden; transition:transform .35s cubic-bezier(.2,.8,.2,1), visibility 0s .35s; }
  .detail.show { transform:none; visibility:visible; transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .d-bar { position:sticky; top:0; z-index:2; display:flex; align-items:center; padding:8px 18px; background:var(--bar); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .d-bar::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.7; }
  .d-wrap { max-width:1000px; margin:0 auto; padding:26px 24px 50px; }
  .d-top { display:flex; gap:26px; align-items:center; }
  .d-icon { flex:none; width:132px; height:132px; border-radius:30px; display:flex; align-items:center; justify-content:center; background:linear-gradient(120deg,#2b1d12 0%,#4a3422 55%,#6b4a2c 100%);
    box-shadow:inset 0 0 0 1px rgba(230,199,122,.5), var(--shadow); }
  .d-icon img { width:92px; height:92px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
  .d-t { flex:1; min-width:0; }
  .d-t .k { font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold2); font-weight:700; }
  .d-t h2 { margin:4px 0 6px; font:700 2.3rem/1.1 Cinzel,Georgia,serif; }
  .d-t p { margin:0; color:var(--muted); font-size:1rem; line-height:1.45; }
  #d-act { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px; }
  #d-act .btn { padding:12px 34px; font-size:1.02rem; }
  #d-act .status { margin:0; flex-basis:100%; } #d-act .bar { flex-basis:100%; margin:0; }
  .facts { display:flex; margin:24px 0 6px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); }
  .facts div { flex:1; padding:14px 10px; text-align:center; border-left:1px solid var(--line); min-width:0; }
  .facts div:first-child { border-left:0; }
  .facts b { display:block; font-weight:700; color:var(--gold2); font-size:1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .facts small { display:block; color:var(--muted); font-size:.75rem; margin-top:3px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
  .shots { display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding:4px 2px 12px; margin:0 -2px; }
  .shots::-webkit-scrollbar { display:none; }
  .shots img { flex:none; width:min(560px,80vw); aspect-ratio:16/10; object-fit:cover; border-radius:18px; scroll-snap-align:start; background:var(--surface2);
    border:1px solid var(--gold); box-shadow:var(--shadow); }
  .sdots { display:flex; justify-content:center; gap:7px; }
  .sdots i { width:8px; height:8px; border-radius:4px; background:var(--line); transition:width .25s, background .25s; }
  .sdots i.on { width:24px; background:linear-gradient(90deg,var(--goldhi),var(--gold)); }
  .d-about { padding:16px 20px; line-height:1.6; font-size:1rem; }
  @media (max-width:640px) { .d-top { flex-direction:column; text-align:center; } #d-act { justify-content:center; } .d-wrap { padding:18px 16px 40px; } .d-t h2 { font-size:1.8rem; } }
  /* Sign in + approval (0.23.0): a full screen that covers App Vault until Su approves this person in Studio */
  .gate { position:fixed; inset:0; z-index:30; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:radial-gradient(900px 500px at 80% -10%, var(--glow), transparent 60%), radial-gradient(800px 500px at -10% 110%, var(--glow), transparent 60%), linear-gradient(180deg,var(--bg),var(--bg2)); }
  .gate[hidden] { display:none; }
  .gate-in { width:min(460px,100%); text-align:center; }
  .gate-in > img { width:86px; height:86px; border-radius:22px; box-shadow:0 0 0 1px var(--gold), 0 10px 30px var(--glow); }
  .gate-in h2 { margin:18px 0 6px; font:700 1.9rem/1.15 Cinzel,Georgia,serif; letter-spacing:.04em; }
  .gate-in > p { margin:0 auto 22px; color:var(--muted); line-height:1.5; max-width:380px; }
  .gate-card { text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:20px; box-shadow:var(--shadow); }
  .gate-card label { display:block; font-weight:700; font-size:.88rem; color:var(--gold2); margin:0 0 6px; }
  .gate-card label small { color:var(--muted); font-weight:500; }
  .gate-card input, .gate-card textarea { width:100%; border:1px solid var(--line); border-radius:14px; background:var(--surface2); color:var(--text); padding:13px 14px; font:500 1rem Inter,sans-serif; outline:none; margin-bottom:16px; user-select:text; }
  .gate-card textarea { min-height:78px; resize:vertical; }
  .gate-card input:focus, .gate-card textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px var(--glow); }
  .gate-dev { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.88rem; margin:0 0 18px; padding:10px 12px; border-radius:12px; background:var(--surface2); }
  .gate-dev b { color:var(--text); font-weight:600; }
  .gate-err { color:#e08a5a; font-size:.9rem; min-height:1.2em; margin-top:10px; text-align:center; }
  .gate-wait { display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .gate-wait .ring { width:54px; height:54px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--gold); animation:spin 1.4s linear infinite; }
  .gate-wait b { font:700 1.15rem Cinzel,Georgia,serif; }
  .gate-wait span { color:var(--muted); font-size:.92rem; line-height:1.5; }
  .gate-link { margin-top:14px; border:0; background:none; color:var(--gold2); font:600 .9rem Inter,sans-serif; cursor:pointer; text-decoration:underline; }
  /* Notes & bug reports (page 0.29.0): on each app page; the form opens over it */
  .rp-box { padding:18px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .rp-box p { flex:1; min-width:220px; margin:0; color:var(--muted); line-height:1.5; }
  .rp-list { margin-top:12px; display:flex; flex-direction:column; gap:10px; }
  .rp-item { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 16px; }
  .rp-item .top { display:flex; justify-content:space-between; gap:10px; font-size:.8rem; color:var(--muted); font-weight:600; }
  .rp-item .top b { color:var(--gold2); } .rp-item .top b.done { color:var(--muted); }
  .rp-item p { margin:6px 0 0; white-space:pre-wrap; line-height:1.45; user-select:text; }
  .rp-bg { position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  .rp-bg[hidden] { display:none; }
  .rp-card { width:min(560px,100%); max-height:92vh; overflow-y:auto; background:var(--bg); border:1px solid var(--gold); border-radius:22px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .rp-card .hd { display:flex; align-items:center; gap:12px; margin-bottom:12px; } .rp-card .hd img { width:40px; height:40px; }
  .rp-card .hd h4 { flex:1; margin:0; font:700 1.3rem Cinzel,Georgia,serif; }
  .rp-card textarea { width:100%; min-height:130px; resize:vertical; border:1px solid var(--line); border-radius:14px; background:var(--surface2); color:var(--text); padding:13px 14px; font:500 1rem/1.45 Inter,sans-serif; outline:none; user-select:text; }
  .rp-card textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px var(--glow); }
  .rp-photos { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }

<script>
const REPO = 'glickshulem-stack/apps';
const hasHub = typeof Hub !== 'undefined';
const hubVer = hasHub ? Hub.hubVersion() : 'web';
const status = {}; let catalog = null, lastCheck = null;
try { const t = localStorage.getItem('lastCheck'); if (t) lastCheck = new Date(+t); } catch {}
const $ = id => document.getElementById(id);

function newer(a, b) { const x=a.split('.').map(Number), y=(b||'0').split('.').map(Number); for (let i=0;i<3;i++) if ((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0); return false; }
function apkUrl(a) { return `https://github.com/${REPO}/releases/download/${a.id}-v${a.version}/${a.id}.apk`; }
const PAGE_VER = '0.37.0';
// App Vault 0.5.0+ keeps downloads and reports progress. Older App Vault only has Hub.install + onStatus.
const kept2 = hasHub && typeof Hub.bridge === 'function' && Hub.bridge() >= 2;
const flow = {};   // id -> { version, phase: 'start' | 'installer' | 'back' | 'permission' }
let ticker = null;

function onStatus(id, text) { status[id] = text; render(); }          // old App Vault
function hubEvent(id, what) {
  if (flow[id]) flow[id].phase = what; else flow[id] = { phase: what };
  render();
  const app = catalog && (appById(id) || catalog.apps.find(x => x.id === id));
  if (what === 'installed' && app) toast('✓', `${app.name} is updated`, 'Installed by App Vault');
  if (what === 'installed' && typeof reportApps === 'function') reportApps();
}
function job(id) { try { const s = Hub.job(id); return s ? JSON.parse(s) : null; } catch { return null; } }
function mb(n) { return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB'; }
function act(a) {
  flow[a.id] = { version: a.version, phase: 'start' };
  if (kept2) { if (Hub.kept(a.id) === a.version) Hub.installKept(a.id); else Hub.download(a.id, apkUrl(a), a.version); }
  else { status[a.id] = 'Starting download…'; Hub.install(a.id, apkUrl(a)); }
  render();
}
// App Vault came back to the front (e.g. the Android install screen closed)
function onHubResume() { for (const id in flow) if (flow[id].phase === 'installer') flow[id].phase = 'back'; }

/* Beta (page 0.35.0). catalog.json apps[i].beta = { version, note } is a Beta of a public app; betaApps = apps only in Beta.
   members/{uid}.beta === 'yes' = this person is in Beta (they asked with Join Beta, Su approved in Studio);
   members/{uid}.early = { appId: entry } = a version Su sent to just this person. Both show a gold BETA tag.
   A person on the normal version is offered normal updates, and can install the Beta from the app page (after a warning).
   Once a Beta is installed (installed version newer than public), they get that app's Beta updates by themselves. */
function vaultMe() { try { return gate.me && gate.me.status === 'approved' ? gate.me : null; } catch { return null; } }
function betaFor(a) {
  const m = vaultMe(); if (!m) return null;
  let best = null;
  if (m.beta === 'yes' && a.beta && a.beta.version) best = { version:a.beta.version, note:a.beta.note || '' };
  const e = m.early && m.early[a.id];
  if (e && e.version && (!best || newer(e.version, best.version))) best = { version:e.version, note:e.note || '', early:true };
  return best && newer(best.version, a.version) ? best : null;
}
function vaultApps() {
  if (!catalog) return [];
  const m = vaultMe(), out = [];
  for (const a of catalog.apps) {
    if (a.id === 'hub') continue;
    const have = hasHub ? Hub.installedVersion(a.package) : '', b = betaFor(a), f = flow[a.id];
    const going = b && ((have && newer(have, a.version)) || (f && f.version === b.version) || (kept2 && Hub.kept(a.id) === b.version));
    if (going) out.push({ ...a, pubVersion:a.version, version:b.version, isBeta:true, betaNote:b.note, early:b.early });
    else out.push({ ...a, pubVersion:a.version, betaAvail:b });
  }
  if (m) {
    for (const a of catalog.betaApps || []) {
      if (out.some(x => x.id === a.id)) continue;
      const e = m.early && m.early[a.id]; let v = m.beta === 'yes' ? a.version : null;
      if (e && e.version && (!v || newer(e.version, v))) v = e.version;
      if (v) out.push({ ...a, version:v, isBeta:true, betaOnly:true, betaNote:(a.beta && a.beta.note) || '', early:!!(e && v === e.version) });
    }
    for (const id in m.early || {}) {   // an app Su sent only to this person
      const e = m.early[id]; if (!e || !e.package || !e.version || out.some(x => x.id === id) || id === 'hub') continue;
      out.push({ ...e, id, isBeta:true, betaOnly:true, early:true });
    }
  }
  return out;
}
const appById = id => vaultApps().find(x => x.id === id);
const onBetaBuild = (a, have) => !!(have && (a.betaOnly || (a.pubVersion && newer(have, a.pubVersion))));
// The warning before a Beta goes on this device (Su: going back means a newer normal version, or uninstalling and losing the app's data).
function betaWarn(a, ver, go) {
  ask(`Install the Beta of ${esc(a.name)}?`,
    `<p>Beta versions come early, before everyone else, so they can have bugs.</p>
     <p><b>Going back is not simple:</b> to get off the Beta, you either wait until a newer normal version of ${esc(a.name)} comes out (App Vault offers it by itself), or you uninstall ${esc(a.name)}, which <b>deletes all its data</b> on this device.</p>`,
    `Install Beta ${esc(ver)}`, go);
}
function ask(title, html, okLabel, go) {
  let box = $('ask'); if (!box) { document.body.insertAdjacentHTML('beforeend', '<div class="ask-bg" id="ask" hidden></div>'); box = $('ask'); }
  box.innerHTML = `<div class="ask"><h4 class="goldtext">${title}</h4>${html}<div class="ask-acts"><button class="ask-no" id="ask-no">Not now</button><button class="btn" id="ask-ok">${okLabel}</button></div></div>`;
  box.hidden = false;
  const close = () => { box.hidden = true; box.innerHTML = ''; };
  $('ask-no').onclick = close; box.onclick = e => { if (e.target === box) close(); };
  $('ask-ok').onclick = () => { close(); go(); };
}
/* What an app's card should show right now: a button (or none), a status line, and maybe a progress bar. */
function stateOf(a, have) {
  const need = !have || newer(a.version, have), f = flow[a.id];
  const btn = (label, cls, fn) => ({ label, cls, fn });
  const get = need ? btn(have ? 'Update' : 'Install', have ? 'update' : 'install', () => act(a)) : null;
  const open = a.package !== 'com.glickshulem.apphub' ? btn('Open', 'open', () => Hub.open(a.package)) : null;
  if (f && f.version && have && !newer(f.version, have))
    return { btn: open, status: `✓ ${have ? 'Updated' : 'Installed'} to v${f.version}`, cls: 'done' };
  if (!kept2) {   // old App Vault: text status only, bar parsed from it
    const t = status[a.id] || '', m = t.match(/Downloading (\d+)%/);
    if (m) return { btn: null, status: `Downloading… ${m[1]}%`, pct: +m[1] };
    if (t === 'Starting download…') return { btn: null, status: t, pct: -1 };
    return { btn: need ? get : open, status: t };
  }
  if (!need) return { btn: open, status: '' };
  const j = job(a.id);
  if (j && j.state === 'downloading' && j.version === a.version) {
    const pct = j.total ? Math.floor(j.done * 100 / j.total) : -1;
    return { btn: null, pct, status: j.total ? `Downloading… ${pct}%  ·  ${mb(j.done)} of ${mb(j.total)}` : (j.done ? `Downloading… ${mb(j.done)}` : 'Starting download…') };
  }
  if (f && f.phase === 'installing')
    return { btn: null, pct: -1, status: a.id === 'hub' ? 'Installing… App Vault closes for a moment to update itself. Open it again after.' : 'Installing… no need to tap anything.' };
  if (Hub.kept(a.id) === a.version) {
    const b = btn('Install', 'install', () => act(a));
    if (f && f.phase === 'failed') return { btn: btn('Try again', 'update', () => act(a)), status: 'The install didn\'t finish. Tap Try again.', cls: 'warn' };
    if (f && f.phase === 'permission') return { btn: b, status: 'Turn on "Allow from this source" for App Vault, then come back. It installs right after.', cls: 'warn' };
    if (f && f.phase === 'installer') return { btn: null, status: 'Downloaded ✓  Tap Install on the Android screen (only needed this once).' };
    if (f && f.phase === 'back') return { btn: b, status: 'Not installed yet. The download is saved, so tap Install whenever you\'re ready.' };
    return { btn: b, status: 'Downloaded and saved ✓  Tap Install when you\'re ready.' };
  }
  if (j && j.state === 'failed' && j.version === a.version)
    return { btn: btn('Try again', 'update', () => act(a)), status: 'Download stopped. Check the internet, then tap Try again. It carries on where it stopped.', cls: 'warn' };
  return { btn: get, status: '' };
}

function button(a, have) {
  if (!hasHub) {
    if (!a.webPath) return null;
    const b = document.createElement('button'); b.className = 'btn open'; b.textContent = 'Open';
    b.onclick = () => location.href = '../' + a.webPath; return b;
  }
  const s = stateOf(a, have).btn; if (!s) return null;
  const b = document.createElement('button'); b.className = 'btn ' + s.cls; b.textContent = s.label; b.onclick = s.fn;
  if (a.isBeta && s.cls !== 'open') {
    b.insertAdjacentHTML('beforeend', ' <i class="bt">BETA</i>');
    if (!onBetaBuild(a, have)) b.onclick = () => betaWarn(a, a.version, s.fn);   // first time on the Beta: warn first
  }
  return b;
}
function barHtml(st) { return st && st.pct != null ? `<div class="bar${st.pct < 0 ? ' wait' : ''}"><i style="${st.pct >= 0 ? `width:${st.pct}%` : ''}"></i></div>` : ''; }

// Greeting and date at the top (the summary pills were removed in 0.20.0, Su's wish)
function renderTop() {
  const now = new Date(), h = now.getHours();
  $('w-date').textContent = now.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
  $('w-hi').textContent = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
