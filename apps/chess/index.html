<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1918">
<title>Gambit</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chess.css">
</head>
<body data-theme="fide" data-bg="saddle">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="bevel" x="-10%" y="-10%" width="120%" height="130%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="0.9" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.9" specularExponent="18" lighting-color="#fff6e0" result="spec"><fePointLight x="-20" y="-30" z="40"/></feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feDiffuseLighting in="blur" surfaceScale="3" diffuseConstant="1" lighting-color="#ffffff" result="diff"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting>
    <feComposite in="diff" in2="SourceAlpha" operator="in" result="diffIn"/>
    <feBlend in="SourceGraphic" in2="diffIn" mode="multiply" result="shaded"/>
    <feComposite in="specIn" in2="shaded" operator="arithmetic" k2="0.55" k3="1" result="lit"/>
    <feDropShadow in="lit" dx="0.6" dy="1.4" stdDeviation="0.9" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <filter id="bevel2" x="-10%" y="-10%" width="120%" height="130%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.2" specularExponent="22" lighting-color="#fff2d0" result="spec"><fePointLight x="-20" y="-30" z="35"/></feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feDiffuseLighting in="blur" surfaceScale="5" diffuseConstant="1.05" lighting-color="#ffffff" result="diff"><feDistantLight azimuth="225" elevation="45"/></feDiffuseLighting>
    <feComposite in="diff" in2="SourceAlpha" operator="in" result="diffIn"/>
    <feBlend in="SourceGraphic" in2="diffIn" mode="multiply" result="shaded"/>
    <feComposite in="specIn" in2="shaded" operator="arithmetic" k2="0.8" k3="1" result="lit"/>
    <feDropShadow in="lit" dx="1" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
  </filter>
</defs></svg>
<div class="layout">
  <section class="play">
    <div id="board"></div>
  </section>
  <aside class="panel">
    <header class="topbar">
      <a href="../../" class="iconbtn" id="back" aria-label="Back to apps">‹</a>
      <div class="brand"><img src="logo.svg" alt=""><span class="name">Gambit</span><span class="ver">v<span id="ver"></span></span></div>
    </header>
    <div class="status-card"><div class="turn-dot" id="turn-dot"></div><div id="status"></div></div>
    <div class="actions">
      <button id="newgame" class="act"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New game</span></button>
      <button id="undo" class="act"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg><span>Undo</span></button>
      <button id="flip" class="act"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg><span>Flip</span></button>
    </div>
  </aside>
</div>
<div id="promo" class="overlay"><div class="dialog"><div class="dtitle">Promote pawn to</div><div id="promo-choices"></div></div></div>
<div id="confirm" class="overlay"><div class="dialog"><div class="dtitle">Start a new game?</div><div class="drow"><button class="act ghost" id="no">Cancel</button><button class="act primary" id="yes">New game</button></div></div></div>
<script src="chess.js"></script>
</body>
</html>
